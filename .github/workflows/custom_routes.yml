name: Build custom routes IPA

on:
  push:
    branches: [route-speed-repeat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check speed conversion and continuous round trips
        run: |
          swiftc StikDebug/Services/RoutePlaybackOptions.swift RoutePlaybackTimingChecks.swift -o /tmp/route-checks
          /tmp/route-checks
      - name: Compile unsigned iPhone app
        run: |
          xcodebuild archive \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/
          zip -r StikDebug-CustomRoutes.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: StikDebug-CustomRoutes
          path: StikDebug-CustomRoutes.ipa
          retention-days: 7
